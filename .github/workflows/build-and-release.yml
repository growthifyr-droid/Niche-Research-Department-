name: Build Niche Research Department

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --include=optional
          npm install --no-save @tailwindcss/oxide-win32-x64-msvc @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @esbuild/win32-x64

      - name: Get version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version.trim()")
          echo "Building Niche Research Department version: $VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish app installer & update metadata
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output artifacts
        run: |
          Write-Host "Listing generated build artifacts in release/ and dist/:"
          if (Test-Path release) { Get-ChildItem -Path release | Format-Table Name, Length, LastWriteTime }
          if (Test-Path dist) { Get-ChildItem -Path dist | Format-Table Name, Length, LastWriteTime }

      - name: Ensure release artifacts are published
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Niche Research Department ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

